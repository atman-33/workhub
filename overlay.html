<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>workhub ink overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        cursor: crosshair;
      }
      canvas {
        display: block;
      }
      /* Pen-color chip following the pointer (offset to its lower right). */
      #chip {
        position: fixed;
        left: 0;
        top: 0;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        pointer-events: none;
        display: none;
        will-change: transform;
      }
      /* Save feedback. An OS notification would land behind the overlay and
         outlive the gesture; this sits where the user is already looking and
         fades on its own. */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        max-width: 70vw;
        padding: 8px 14px;
        border-radius: 8px;
        background: rgba(20, 20, 20, 0.88);
        color: #fff;
        font:
          13px/1.4 "Segoe UI",
          system-ui,
          sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        opacity: 0;
        transition: opacity 150ms ease;
      }
      #toast.error {
        background: rgba(150, 30, 30, 0.92);
      }
      /* "Saving…" state: a spinner rides in front of the text so the user can
         tell Alt+C registered even while the compose+encode is still running. */
      #toast.saving::before {
        content: "";
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 8px;
        vertical-align: -2px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: toast-spin 0.8s linear infinite;
      }
      @keyframes toast-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Success: a leading checkmark, colored so it reads at a glance. */
      #toast.ok::before {
        content: "✓ ";
        color: #4ade80;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <canvas id="ink"></canvas>
    <div id="chip"></div>
    <div id="toast"></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
