<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Deck proof</title>
<style>
  :root{
    --ink:#1a1a1a; --sub:#666; --line:#c8c8c8; --faint:#eee;
    --accent:#b3121a; --bg:#f2f2f2; --paper:#fff;
    --W:1280px; --H:720px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:"Segoe UI","Yu Gothic UI","Hiragino Sans",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); height:100vh; overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ---- header ---- */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:16px;
    padding:8px 16px; background:#fff; border-bottom:1px solid var(--line);
    font-size:13px;
  }
  header .pos{font-weight:700; font-size:15px; min-width:70px}
  header .ttl{flex:1; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  header .chip{padding:2px 8px; border:1px solid var(--line); border-radius:10px; color:var(--sub)}
  header .chip.warn{color:#fff; background:var(--accent); border-color:var(--accent)}
  header .keys{color:#999; font-size:11px}

  /* ---- stage ----
     The slide is scaled with transform, which does NOT change its layout box.
     Centring it with flex/grid therefore breaks on narrow viewports; absolute
     positioning plus translate(-50%,-50%) is what keeps it centred. */
  #stage{flex:1 1 auto; position:relative; overflow:hidden}
  #scaler{
    position:absolute; left:50%; top:50%;
    width:var(--W); height:var(--H); transform-origin:center center;
  }
  .slide{
    width:var(--W); height:var(--H); background:var(--paper);
    border:1px solid var(--line); box-shadow:0 2px 12px rgba(0,0,0,.12);
    padding:44px 56px; display:flex; flex-direction:column; position:relative;
  }
  .slide.of{border:3px solid var(--accent)}
  .of-badge{
    display:none; position:absolute; top:-1px; right:-1px; background:var(--accent);
    color:#fff; font-size:12px; font-weight:700; padding:4px 10px; letter-spacing:.04em;
  }
  .slide.of .of-badge{display:block}

  .slide h1{font-size:38px; line-height:1.25; letter-spacing:-.01em}
  .slide h2{font-size:27px; line-height:1.3; padding-bottom:10px; border-bottom:3px solid var(--ink)}
  .slide .sub{font-size:15px; color:var(--sub); margin-top:6px}
  .body{flex:1 1 auto; overflow:hidden; margin-top:22px; font-size:17px; line-height:1.6}
  .body.big{font-size:22px; line-height:1.75}

  ul{margin-left:1.1em} li{margin:5px 0}
  .em{color:var(--accent); font-weight:700}
  .note-inline{font-size:13px; color:var(--sub); margin-top:12px}

  table{border-collapse:collapse; width:100%; font-size:14px}
  th,td{border:1px solid var(--line); padding:7px 9px; vertical-align:top; text-align:left}
  th{background:var(--faint); font-weight:700; white-space:nowrap}
  td.k{white-space:nowrap; font-weight:700; background:#fafafa; width:120px}
  .mini td, .mini th{font-size:12.5px; padding:5px 7px; line-height:1.45}

  /* Add `dense` to a .body that is content-heavy. Use it only after cutting
     content has failed — text below ~12px stops reading from the back of a room. */
  .dense .goal{font-size:15px; line-height:1.55; padding:9px 13px; border-left-width:4px}
  .dense table{margin-top:9px !important}
  .dense .mini td, .dense .mini th{font-size:12.2px; padding:4px 7px; line-height:1.42}
  .dense .mini td.k{font-size:12.2px}

  .cols{display:grid; gap:20px; height:100%}
  .c2{grid-template-columns:repeat(2,1fr)}
  .c3{grid-template-columns:repeat(3,1fr)}
  .box{border:1px solid var(--line); padding:14px 16px}
  .box h3{font-size:18px; margin-bottom:8px; border-bottom:2px solid var(--ink); padding-bottom:5px}
  .box p{font-size:14px; line-height:1.6}

  .goal{border-left:5px solid var(--ink); padding:12px 16px; background:#fafafa; font-size:16.5px; line-height:1.65}
  .kv{display:flex; gap:14px; font-size:14px; margin-top:10px}
  .kv div{flex:1; border:1px solid var(--line); padding:9px 12px}

  /* ---- notes ---- */
  #notes{
    flex:0 0 auto; display:none; border-top:1px solid var(--line); background:#fff;
    padding:10px 16px; font-size:13.5px; line-height:1.6; max-height:22vh; overflow:auto;
  }
  #notes.on{display:block}
  #notes b{display:block; font-size:11px; color:var(--sub); letter-spacing:.08em; margin-bottom:4px}

  /* ---- grid overview ---- */
  #grid{
    display:none; position:absolute; inset:0; background:rgba(242,242,242,.97);
    padding:20px; overflow:auto; grid-template-columns:repeat(4,1fr); gap:12px; align-content:start;
  }
  #grid.on{display:grid}
  #grid .g{
    background:#fff; border:1px solid var(--line); padding:10px; cursor:pointer;
    font-size:13px; min-height:78px;
  }
  #grid .g:hover{border-color:var(--ink)}
  #grid .g .n{font-size:11px; color:var(--sub)}
  #grid .g.of{border:2px solid var(--accent)}
</style>
</head>
<body>

<header>
  <span class="pos" id="pos"></span>
  <span class="ttl" id="ttl"></span>
  <span class="chip" id="clock"></span>
  <span class="chip" id="ofc"></span>
  <span class="keys">&larr; &rarr; step / N notes / G grid / digits jump</span>
</header>

<div id="stage">
  <div id="scaler"></div>
  <div id="grid"></div>
</div>

<div id="notes"><b>SPEAKER NOTE</b><span id="noteText"></span></div>

<script>
/* =========================================================================
   THE PROOF — this array is the single source of truth for the deck.
   Every revision edits it. Nothing below this array needs to change.

   sec  = seconds this slide takes to explain (used for the time budget)
   note = what is said out loud and is NOT on the slide
   ========================================================================= */
const BUDGET_SEC = 1200;   // the time the user has, in seconds

const SLIDES = [
{
  sec:40, title:"Title",
  html:`
    <h1>Deck title</h1>
    <div class="sub">Subtitle / speaker</div>
    <div class="body big">
      <div class="goal">
        One sentence stating what this meeting must settle.
      </div>
      <div class="kv">
        <div><b>Decider</b>　name</div>
        <div><b>When</b>　date</div>
      </div>
    </div>`,
  note:"Open by stating the one thing to settle."
},
{
  sec:90, title:"Example content slide",
  html:`
    <h2>Example content slide</h2>
    <div class="body">
      <table>
        <tr><th style="width:140px">Column</th><th>Column</th></tr>
        <tr><td class="k">Row</td><td>Cell</td></tr>
      </table>
      <div class="note-inline">A footnote sits here.</div>
    </div>`,
  note:"Delete these two examples once the real slides are in."
}
];

/* ========================= harness ========================= */
const scaler = document.getElementById('scaler');
const grid   = document.getElementById('grid');
const posEl  = document.getElementById('pos');
const ttlEl  = document.getElementById('ttl');
const clockEl= document.getElementById('clock');
const ofcEl  = document.getElementById('ofc');
const notes  = document.getElementById('notes');
const noteTx = document.getElementById('noteText');

let idx = 0;
let overflow = new Array(SLIDES.length).fill(false);

function slideEl(i){
  const d = document.createElement('div');
  d.className = 'slide';
  d.innerHTML = '<div class="of-badge">OVERFLOW</div>' + SLIDES[i].html;
  return d;
}

/* A .body smaller than its box reports scrollHeight === clientHeight, so
   scrollHeight alone cannot tell "fits" from "just fits". Measuring the
   bottom of the last child against the box is what actually detects clipping. */
function fillRatio(el){
  const b = el.querySelector('.body');
  if(!b) return 0;
  const bb = b.getBoundingClientRect();
  let max = 0;
  [...b.children].forEach(c => { max = Math.max(max, c.getBoundingClientRect().bottom - bb.top); });
  return bb.height ? max / bb.height : 0;
}

/* Measure every slide once, off-screen, at full 1280x720. */
function measureAll(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute; left:-99999px; top:0';
  document.body.appendChild(probe);
  const report = SLIDES.map((s,i)=>{
    const el = slideEl(i);
    probe.appendChild(el);
    const r = fillRatio(el);
    overflow[i] = r > 1;
    probe.removeChild(el);
    return { slide:i+1, title:s.title, fill:Math.round(r*100)+'%', overflow:overflow[i] };
  });
  probe.remove();
  return report;
}
/* Called from the console / an automation step; returns the per-slide report. */
window.measure = () => ({
  slides: measureAll(),
  totalSec: SLIDES.reduce((a,s)=>a+s.sec,0),
  budgetSec: BUDGET_SEC
});

function fit(){
  const st = document.getElementById('stage');
  const pad = 12;
  const k = Math.min((st.clientWidth - pad)/1280, (st.clientHeight - pad)/720);
  scaler.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
}

function fmt(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}

function render(){
  scaler.innerHTML = '';
  const el = slideEl(idx);
  if(overflow[idx]) el.classList.add('of');
  scaler.appendChild(el);

  posEl.textContent = (idx+1) + ' / ' + SLIDES.length;
  ttlEl.textContent = SLIDES[idx].title;
  noteTx.textContent = SLIDES[idx].note || '(no note)';

  const total = SLIDES.reduce((a,s)=>a+s.sec,0);
  const upto  = SLIDES.slice(0,idx+1).reduce((a,s)=>a+s.sec,0);
  clockEl.textContent = fmt(upto) + ' / ' + fmt(total) + '  (budget ' + fmt(BUDGET_SEC) + ')';
  clockEl.classList.toggle('warn', total > BUDGET_SEC);

  const n = overflow.filter(Boolean).length;
  ofcEl.textContent = n ? (n + ' overflow') : 'fits';
  ofcEl.classList.toggle('warn', n > 0);

  fit();
}

function buildGrid(){
  grid.innerHTML = '';
  SLIDES.forEach((s,i)=>{
    const g = document.createElement('div');
    g.className = 'g' + (overflow[i] ? ' of' : '');
    g.innerHTML = '<div class="n">' + (i+1) + '　' + fmt(s.sec) + '</div><div>' + s.title + '</div>';
    g.onclick = ()=>{ idx = i; grid.classList.remove('on'); render(); };
    grid.appendChild(g);
  });
}

let numBuf = '';
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'j'){
    idx = Math.min(idx+1, SLIDES.length-1); render(); e.preventDefault();
  } else if(e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'k'){
    idx = Math.max(idx-1, 0); render(); e.preventDefault();
  } else if(e.key === 'Home'){ idx = 0; render(); }
  else if(e.key === 'End'){ idx = SLIDES.length-1; render(); }
  else if(e.key.toLowerCase() === 'n'){ notes.classList.toggle('on'); fit(); }
  else if(e.key.toLowerCase() === 'g'){ grid.classList.toggle('on'); }
  else if(/^[0-9]$/.test(e.key)){
    numBuf += e.key;
    clearTimeout(window.__nb);
    window.__nb = setTimeout(()=>{
      const n = parseInt(numBuf,10);
      if(n>=1 && n<=SLIDES.length){ idx = n-1; render(); }
      numBuf = '';
    }, 450);
  }
});

window.addEventListener('resize', fit);
measureAll();
buildGrid();
render();
</script>
</body>
</html>
